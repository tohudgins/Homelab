# rtr-01 NTP — syncs to a real pool over WAN, serves time to every internal
# segment. dc-01 (Phase 2), as PDC emulator, syncs to rtr-01 in turn per AD's
# normal time topology — see docs/design-decisions.md's time-sync warning.

pool 2.debian.pool.ntp.org iburst

# Serve time to every internal segment
allow 10.10.10.0/24
allow 10.10.20.0/24
allow 10.10.30.0/24
allow 10.10.40.0/24

# Keep serving a reasonable time even if the WAN pool is briefly unreachable
local stratum 10

driftfile /var/lib/chrony/chrony.drift
ntsdumpdir /var/lib/chrony
leapsectz right/UTC
logdir /var/log/chrony
