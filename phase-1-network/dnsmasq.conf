# rtr-01 DHCP/DNS — DMZ, SOC/MGMT, REDTEAM only.
# CORP is deliberately excluded: dc-01 owns CORP's DHCP/DNS once Phase 2 builds it.
# See docs/00-ip-plan.md for the authoritative segment/addressing table.

# Only bind and serve on the segments rtr-01 owns
interface=enp3s0
interface=enp11s0
interface=enp19s0
bind-interfaces
except-interface=lo
no-dhcp-interface=enp2s0
no-dhcp-interface=enp26s0

# Upstream DNS for anything not resolved locally — explicit, not dependent on resolv.conf
no-resolv
server=1.1.1.1
server=1.0.0.1

# DHCP ranges: dynamic pool .100-.200 per segment, leaving .2-.99 free for
# named/static roles (dmz-01 .10, siem-01 .10, atk-01 .10, scan-01 .20, etc.)
dhcp-range=set:dmz,10.10.20.100,10.10.20.200,255.255.255.0,12h
dhcp-range=set:soc,10.10.30.100,10.10.30.200,255.255.255.0,12h
dhcp-range=set:red,10.10.40.100,10.10.40.200,255.255.255.0,12h

# Gateway handed out per segment = rtr-01's own address on that segment
dhcp-option=tag:dmz,option:router,10.10.20.1
dhcp-option=tag:soc,option:router,10.10.30.1
dhcp-option=tag:red,option:router,10.10.40.1

# DNS server handed out per segment = rtr-01's own address on that segment
dhcp-option=tag:dmz,option:dns-server,10.10.20.1
dhcp-option=tag:soc,option:dns-server,10.10.30.1
dhcp-option=tag:red,option:dns-server,10.10.40.1

# NTP server handed out per segment = rtr-01's own address (chrony, next step)
dhcp-option=tag:dmz,option:ntp-server,10.10.20.1
dhcp-option=tag:soc,option:ntp-server,10.10.30.1
dhcp-option=tag:red,option:ntp-server,10.10.40.1
