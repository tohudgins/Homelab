set timeout=5

loadfont unicode

set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

set cmdline=
smbios --type 4 --get-string 5 --set proc_version
regexp "Snapdragon.*" "$proc_version"
if [ $? = 0 ]; then
  if [ $lockdown != "y" ]; then
    cutmem 0x8800000000 0x8fffffffff
  fi
  cmdline="clk_ignore_unused pd_ignore_unused arm64.nopauth"
fi

# Kali arm64 installer paths (confirmed against kali-linux-2026.2-installer-arm64.iso):
#   /install.a64/vmlinuz + /install.a64/initrd.gz
# net.ifnames=0 keeps NICs as eth0/eth1 (the preseed + TOOLS.md assume that). Our
# atk-01-preseed.cfg (remastered onto the ISO root) replaces Kali's stock simple-cdd
# preseed. Serial console for a headless build.
menuentry "Automated install (atk-01 preseed)" {
    set gfxpayload=keep
    linux  /install.a64/vmlinuz $cmdline net.ifnames=0 auto=true priority=critical preseed/file=/cdrom/atk-01-preseed.cfg --- quiet console=tty0 console=ttyS0,115200
    initrd /install.a64/initrd.gz
}
menuentry 'Boot from next volume' {
    exit 1
}
menuentry 'UEFI Firmware Settings' {
    fwsetup
}
