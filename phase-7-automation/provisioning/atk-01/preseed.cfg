# atk-01 — Kali Linux (arm64) unattended preseed. Base Kali + Xfce desktop + SSH
# only; the offensive tooling (BloodHound, Frida/jadx, SecLists, Metasploit db,
# etc.) is layered on afterwards per phase-5-offense/TOOLS.md — atk-01 is NOT in
# the Ansible inventory (an attacker box is driven by hand, not converged).

# Localization
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# Network — install over eth0 (REDTEAM, vmnet6, DHCP from rtr-01). grub passes
# net.ifnames=0 so NICs are eth0/eth1. The CORP NIC (eth1, static 10.10.10.99) is
# configured after build per phase-5-offense/TOOLS.md, not here.
d-i netcfg/choose_interface select eth0
d-i netcfg/get_hostname string atk-01
d-i netcfg/get_domain string lab.internal
d-i netcfg/hostname string atk-01

# Kali mirror
d-i mirror/country string manual
d-i mirror/http/hostname string http.kali.org
d-i mirror/http/directory string /kali
d-i mirror/http/proxy string
d-i mirror/suite string kali-rolling

# Accounts — Kali's modern default is a non-root sudo user. Root login disabled.
# Console password fallback only (lab-only, isolated host — see SECURITY.md).
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Tyler Hudgins
d-i passwd/username string tohudgins
# Password: AtkLab2026!
d-i passwd/user-password-crypted password $6$uevrYrQnzrY4EXSH$W0MV4Q2/r3kfvBlsLGxKvGjgD/qp.J.zuOvfeKRxqZ7v7qtyxnMUgLCgD.sR9hBVbCm9XkMQekMQIJwDXKmQf.
d-i user-setup/allow-password-weak boolean true

# Clock
d-i clock-setup/utc boolean true
d-i time/zone string Etc/UTC
d-i clock-setup/ntp boolean true

# Partitioning — guided, entire disk, single partition
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Base + Kali default toolset + Xfce desktop (atk-01 runs a full lightdm/Xfce
# desktop for the GUI tools — Burp, ZAP, BloodHound). openssh-server for headless.
tasksel tasksel/first multiselect
d-i pkgsel/include string kali-linux-default kali-desktop-xfce openssh-server
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

# GRUB (EFI)
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

# Power off (not reboot); detach the CD before first real boot.
d-i debian-installer/exit/poweroff boolean true

# Drop the homelab SSH key for tohudgins and enable ssh at boot.
d-i preseed/late_command string \
    in-target mkdir -p /home/tohudgins/.ssh; \
    echo 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH7GQV6ykcpEB9lPX4PtS48LOUIeL2N/gA4w5biGD+XS tohudgins@mac-homelab-jumphost' > /target/home/tohudgins/.ssh/authorized_keys; \
    in-target chown -R tohudgins:tohudgins /home/tohudgins/.ssh; \
    in-target chmod 700 /home/tohudgins/.ssh; \
    in-target chmod 600 /home/tohudgins/.ssh/authorized_keys; \
    in-target systemctl enable ssh
