# rtr-01 — Debian 13 (arm64) netinst preseed. Base OS only; the `router` role
# configures nftables/dnsmasq/chrony/Suricata/Zeek and the 4 internal-segment NICs.

# Localization
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# Network — install over the first NIC only (eth0 = WAN, Fusion NAT, DHCP). The
# CORP/DMZ/SOC/REDTEAM NICs (eth1-4) are brought up and addressed by the router role.
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string rtr-01
d-i netcfg/get_domain string lab.internal
d-i netcfg/hostname string rtr-01

# Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# Accounts — root-only, key-based, no sudo user (matches the live rtr-01 model).
# Console password fallback only (lab-only, isolated host — see SECURITY.md).
d-i passwd/root-login boolean true
d-i passwd/make-user boolean false
# Password: RtrLab2026!
d-i passwd/root-password-crypted password $6$RGsQNMVHAq2ExtmE$jfXiGGmHQL0BStiLjNZDpmqIX1.ArCvtXa0SI8hZ00nOkRCtxNUE2HBow9fO1e5kTMkRBpJgmDMho/6KMVnY71

# Clock
d-i clock-setup/utc boolean true
d-i time/zone string Etc/UTC
d-i clock-setup/ntp boolean true

# Partitioning — guided, entire disk, single partition
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Base system + tasks. Minimal: standard utilities + SSH server (the router role
# installs everything else). No desktop.
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string openssh-server
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

# GRUB (EFI)
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

# Power off (not reboot) so the installer can't loop back into the CD; detach the
# CD before the first real boot. Matches the Ubuntu-autoinstall hosts.
# reboot_in_progress note is REQUIRED for a truly hands-off finish — without it d-i
# stops at the "Installation complete / Finish" screen waiting for Enter, even with
# poweroff set (verified live 2026-09-28: the install completed but hung on that note).
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean true

# Drop the homelab SSH key for root and set key-only root login (no password over
# the wire — the crypted password above is console-only).
d-i preseed/late_command string \
    in-target mkdir -p /root/.ssh; \
    echo 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH7GQV6ykcpEB9lPX4PtS48LOUIeL2N/gA4w5biGD+XS tohudgins@mac-homelab-jumphost' > /target/root/.ssh/authorized_keys; \
    in-target chmod 700 /root/.ssh; \
    in-target chmod 600 /root/.ssh/authorized_keys; \
    in-target sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin prohibit-password/' /etc/ssh/sshd_config
