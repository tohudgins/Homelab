set timeout=5

loadfont unicode

set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

set cmdline=
smbios --type 4 --get-string 5 --set proc_version
regexp "Snapdragon.*" "$proc_version"
if [ $? = 0 ]; then
  if [ $lockdown != "y" ]; then
    cutmem 0x8800000000 0x8fffffffff
  fi
  cmdline="clk_ignore_unused pd_ignore_unused arm64.nopauth"
fi

# Debian arm64 netinst installer paths (confirmed against debian-13.6.0-arm64-netinst.iso):
#   /install.a64/vmlinuz + /install.a64/initrd.gz
# auto=true priority=critical + preseed/file drives a fully unattended install from
# the preseed.cfg remastered onto the ISO root. Serial console for headless build.
menuentry "Automated install (rtr-01 preseed)" {
    set gfxpayload=keep
    linux  /install.a64/vmlinuz $cmdline auto=true priority=critical preseed/file=/cdrom/preseed.cfg --- quiet console=tty0 console=ttyS0,115200
    initrd /install.a64/initrd.gz
}
menuentry 'Boot from next volume' {
    exit 1
}
menuentry 'UEFI Firmware Settings' {
    fwsetup
}
