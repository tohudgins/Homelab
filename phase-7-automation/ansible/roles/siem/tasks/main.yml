---
# ============================================================================
# siem-01 — deploy the custom Wazuh detection content (rules + decoders) as code
# and prove the manager still parses its ruleset afterward. Idempotent.
# ============================================================================

- name: Ensure Wazuh core services are enabled and running
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ wazuh_services }}"

# Decoders must be deployed before/with the rules that reference their fields
# (e.g. the samba-full-audit decoder feeding rule 100090). Ownership matches
# what the Wazuh installer sets: wazuh:wazuh 0660.
- name: Deploy custom decoders (detection-as-code)
  ansible.builtin.copy:
    src: local_decoder.xml
    dest: "{{ wazuh_decoders_dir }}/local_decoder.xml"
    owner: "{{ wazuh_group }}"
    group: "{{ wazuh_group }}"
    mode: "0660"
  notify: Restart wazuh-manager

# Threat-intel CDB list — deployed and registered before the rules that query it
# (rules 100210/100211). The manager compiles etc/lists/* into .cdb at restart.
- name: Deploy threat-intel CDB list (known-malicious IPs)
  ansible.builtin.copy:
    src: lists/threat-intel-ips
    dest: /var/ossec/etc/lists/threat-intel-ips
    owner: "{{ wazuh_group }}"
    group: "{{ wazuh_group }}"
    mode: "0660"
  notify: Restart wazuh-manager

- name: Register the threat-intel list in ossec.conf <ruleset>
  ansible.builtin.lineinfile:
    path: /var/ossec/etc/ossec.conf
    line: "    <list>etc/lists/threat-intel-ips</list>"
    insertafter: "<list>etc/lists/audit-keys</list>"
    firstmatch: true
  notify: Restart wazuh-manager

# Malicious-domains CDB list — queried by rule 100310 against Sysmon EID22
# (win.eventdata.queryName), the DNS telemetry the SwiftOnSecurity config added.
- name: Deploy threat-intel CDB list (known-malicious domains)
  ansible.builtin.copy:
    src: lists/malicious-domains
    dest: /var/ossec/etc/lists/malicious-domains
    owner: "{{ wazuh_group }}"
    group: "{{ wazuh_group }}"
    mode: "0660"
  notify: Restart wazuh-manager

- name: Register the malicious-domains list in ossec.conf <ruleset>
  ansible.builtin.lineinfile:
    path: /var/ossec/etc/ossec.conf
    line: "    <list>etc/lists/malicious-domains</list>"
    insertafter: "<list>etc/lists/threat-intel-ips</list>"
    firstmatch: true
  notify: Restart wazuh-manager

- name: Deploy custom rules (detection-as-code)
  ansible.builtin.copy:
    src: local_rules.xml
    dest: "{{ wazuh_rules_dir }}/local_rules.xml"
    owner: root
    group: "{{ wazuh_group }}"
    mode: "0660"
  notify: Restart wazuh-manager

# Sigma detection-as-code: portable Sigma YAML (phase-4-detection/sigma/rules/)
# compiled to Wazuh XML by sigma-to-wazuh.py. This is a GENERATED artifact —
# edit the Sigma sources and re-run the compiler, never this file. Wazuh loads
# every *.xml under etc/rules/ (the <rule_dir>etc/rules</rule_dir> default), so
# it sits alongside local_rules.xml without any ossec.conf change.
- name: Deploy Sigma-compiled rules (detection-as-code)
  ansible.builtin.copy:
    src: sigma_local_rules.xml
    dest: "{{ wazuh_rules_dir }}/sigma_local_rules.xml"
    owner: root
    group: "{{ wazuh_group }}"
    mode: "0660"
  notify: Restart wazuh-manager

# --- MISP integration: integratord -> MISP IOC lookup ------------------------
# The professional TIP as the live IOC engine behind Wazuh. integratord runs
# custom-misp on matching alerts (level>=3); the script self-filters to alerts
# that actually carry an IOC (IP/hash), queries the MISP API, and injects a
# `misp` event on a hit (rules 100300-100302). Supersedes the static CDB list.
- name: Deploy the MISP integration script + wrapper
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/var/ossec/integrations/{{ item }}"
    owner: root
    group: "{{ wazuh_group }}"
    mode: "0750"
  loop:
    - custom-misp
    - custom-misp.py
  notify: Restart wazuh-manager

- name: Configure the MISP integration in ossec.conf
  ansible.builtin.blockinfile:
    path: /var/ossec/etc/ossec.conf
    marker: "<!-- {mark} ANSIBLE MANAGED: MISP integration -->"
    block: |
      <ossec_config>
        <integration>
          <name>custom-misp</name>
          <hook_url>{{ misp_hook_url }}</hook_url>
          <api_key>{{ misp_api_key }}</api_key>
          <level>3</level>
          <alert_format>json</alert_format>
        </integration>
      </ossec_config>
  notify: Restart wazuh-manager

# SOC-operations layer: integratord turns high-severity detections into DFIR-IRIS
# alerts (POST /alerts/add) that analysts triage into cases. level>=10 keeps IRIS
# focused on real incidents (the level-12 custom attack rules); the raw Wazuh alert,
# MITRE techniques, and involved IPs ride along as source_content + tags.
- name: Deploy the IRIS integration script + wrapper
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/var/ossec/integrations/{{ item }}"
    owner: root
    group: "{{ wazuh_group }}"
    mode: "0750"
  loop:
    - custom-iris
    - custom-iris.py
  notify: Restart wazuh-manager

- name: Configure the IRIS integration in ossec.conf
  ansible.builtin.blockinfile:
    path: /var/ossec/etc/ossec.conf
    marker: "<!-- {mark} ANSIBLE MANAGED: IRIS integration -->"
    block: |
      <ossec_config>
        <integration>
          <name>custom-iris</name>
          <hook_url>{{ iris_hook_url }}</hook_url>
          <api_key>{{ iris_api_key }}</api_key>
          <level>10</level>
          <alert_format>json</alert_format>
        </integration>
      </ossec_config>
  notify: Restart wazuh-manager

# Active-response self-DoS guard: firewall-drop (rules 100010/100011) blocks the
# source IP *as siem-01 sees it*. Traffic that arrives via the jump/gateway shows
# up as a segment gateway IP (rtr-01 is the gateway on every segment AND the SSH
# jump host), so a brute-force test blackholed 10.10.30.1 and cut the admin path.
# Whitelisting the four gateway IPs means the AR can never drop critical infra.
# CORP=10.10.10.1  DMZ=10.10.20.1  SOC/jump=10.10.30.1  REDTEAM=10.10.40.1.
# Wazuh merges every <global> across ossec_config sections (the stock config
# already ships two), so this rides as its own block like the integrations above.
- name: Whitelist segment-gateway IPs from active response (infra self-DoS guard)
  ansible.builtin.blockinfile:
    path: /var/ossec/etc/ossec.conf
    marker: "<!-- {mark} ANSIBLE MANAGED: infra whitelist (active-response self-DoS guard) -->"
    block: |
      <ossec_config>
        <global>
          <white_list>10.10.10.1</white_list>
          <white_list>10.10.20.1</white_list>
          <white_list>10.10.30.1</white_list>
          <white_list>10.10.40.1</white_list>
        </global>
      </ossec_config>
  notify: Restart wazuh-manager

# Apply the restart now (not at play end) so the verification below runs against
# the freshly-loaded ruleset — a broken rule file fails here, loudly, instead of
# silently leaving analysisd down.
- name: Apply ruleset restart before verifying
  ansible.builtin.meta: flush_handlers

- name: Verify wazuh-manager parsed the ruleset and analysisd is running
  ansible.builtin.command: /var/ossec/bin/wazuh-control status
  register: wazuh_status
  changed_when: false
  failed_when: "'wazuh-analysisd is running' not in wazuh_status.stdout"
