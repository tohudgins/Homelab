---
# ============================================================================
# siem-01 — one-shot Wazuh all-in-one install, guarded so it only ever runs
# against a genuinely blank host. wazuh-install.sh is destructive (it generates
# its own indexer/dashboard/API passwords, written ONCE to
# wazuh-install-files.tar next to where it runs) — `creates:` on
# /var/ossec/bin/wazuh-control is both the safety guard and the correctness
# check for "is Wazuh already installed."
#
# VERIFIED against a genuinely blank host (2026-09-26, disposable siem-01-verify
# VM on SOC, torn down after) — the installer itself (this file) worked
# correctly first try, no bugs found here. The real finding was one level up,
# in tasks/main.yml: wazuh-install.sh generates a FRESH RANDOM snapshotrestore
# password on every install (this file's own comment above already knew that,
# for the indexer/dashboard/API passwords generally), so the snapshot-backup
# registration task hardcoding one host's password as a static Ansible default
# could only ever work on that one host — it silently 401'd against this
# genuinely fresh install. Fixed by reading the password live from each host's
# own wazuh-install-files.tar instead of a variable; see tasks/main.yml.
# ============================================================================

- name: Check whether Wazuh is already installed
  ansible.builtin.stat:
    path: /var/ossec/bin/wazuh-control
  register: wazuh_precheck

- name: Download the official Wazuh all-in-one installer
  ansible.builtin.get_url:
    url: https://packages.wazuh.com/4.14/wazuh-install.sh
    dest: /root/wazuh-install.sh
    mode: "0750"
  when: not wazuh_precheck.stat.exists

# -a = all-in-one (manager + indexer + dashboard on this single host, matching
# how siem-01 already runs). no_log so the passwords the script prints to
# stdout on completion never land in Ansible's own output/log — they're
# retrievable from /root/wazuh-install-files.tar on the host itself afterward.
- name: Run the Wazuh all-in-one installer (one-shot, destructive — guarded by wazuh-control)
  ansible.builtin.command: bash /root/wazuh-install.sh -a
  args:
    chdir: /root
    creates: /var/ossec/bin/wazuh-control
  no_log: true
