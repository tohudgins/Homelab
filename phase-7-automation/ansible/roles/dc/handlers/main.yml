---
# Only fires if smb.conf actually changes. Restarting the DC daemon briefly drops
# LDAP/Kerberos; the SSH session driving Ansible is independent of Samba, so the
# run survives.
- name: Restart samba-ad-dc
  ansible.builtin.systemd:
    name: "{{ samba_service }}"
    state: restarted

# Reloads the Wazuh agent's localfile config (e.g. the log.smbd SMB-auth source).
# Independent of the SSH session driving Ansible, so the run survives it.
- name: Restart wazuh-agent
  ansible.builtin.systemd:
    name: wazuh-agent
    state: restarted
