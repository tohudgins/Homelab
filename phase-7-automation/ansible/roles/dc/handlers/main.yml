---
# Only fires if smb.conf actually changes. Restarting the DC daemon briefly drops
# LDAP/Kerberos; the SSH session driving Ansible is independent of Samba, so the
# run survives.
- name: Restart samba-ad-dc
  ansible.builtin.systemd:
    name: "{{ samba_service }}"
    state: restarted

# Reloads the Wazuh agent's localfile config (e.g. the log.smbd SMB-auth source).
# Independent of the SSH session driving Ansible, so the run survives it.
- name: Restart wazuh-agent
  ansible.builtin.systemd:
    name: wazuh-agent
    state: restarted

# Only fires when the socket-cleanup drop-in itself changes. A plain `daemon-reload`
# doesn't retroactively fix an auditd process already wedged from a prior restart's
# stale socket, so this restart is what actually applies the fix — see the drop-in's
# own comment in tasks/main.yml for why it's needed at all.
- name: Restart auditd
  ansible.builtin.systemd:
    name: auditd
    state: restarted
    daemon_reload: true
