# Global parameters
[global]
	# auth audit (text + json) drives the Kerberoast detection; the dsdb *_json_audit
	# categories were removed because their per-attribute field dumps overflow Wazuh's
	# JSON decoder ("Too many fields", ~1200/min) — and no detection needs them: the
	# DCSync rule keys off the drsuapi debug line (log level 0), not dsdb audit.
	log level = 1 auth_audit:3 auth_json_audit:3
	dns forwarder = 1.1.1.1
	netbios name = DC-01
	realm = LAB.INTERNAL
	server role = active directory domain controller
	workgroup = LAB
	idmap_ldb:use rfc2307 = yes

[sysvol]
	path = /var/lib/samba/sysvol
	read only = No

[netlogon]
	path = /var/lib/samba/sysvol/lab.internal/scripts
	read only = No
