# Global parameters
[global]
	# auth audit (text + json) drives the Kerberoast detection; the generic dsdb_audit /
	# dsdb_json_audit categories were removed because their per-attribute field dumps
	# overflow Wazuh's JSON decoder ("Too many fields", ~1200/min) — every routine
	# attribute churn (lastLogon, badPwdCount, ...) gets logged, and no detection needs
	# that firehose: the DCSync rule keys off the drsuapi debug line (log level 0), not
	# dsdb audit. dsdb_group_audit/dsdb_group_json_audit is a DIFFERENT, narrower class —
	# it only fires on group *membership* changes (a fixed ~10-field schema matching
	# Windows Event ID 4728, not a generic attribute diff), a genuinely rare event
	# category rather than routine churn, so it doesn't have the same overflow risk.
	# Needed level 5, not 3, to actually emit anything — confirmed 2026-09-12 after the
	# original investigation (level 3, detection-catalog.md's T1098.007 section) got zero
	# output from every dsdb_* class it tried. Drives rules 100014/100015 (privileged AD
	# group membership change).
	log level = 1 auth_audit:3 auth_json_audit:3 dsdb_group_audit:5 dsdb_group_json_audit:5
	dns forwarder = 1.1.1.1
	netbios name = DC-01
	realm = LAB.INTERNAL
	server role = active directory domain controller
	workgroup = LAB
	idmap_ldb:use rfc2307 = yes

[sysvol]
	path = /var/lib/samba/sysvol
	read only = No

[netlogon]
	path = /var/lib/samba/sysvol/lab.internal/scripts
	read only = No
