---
# ============================================================================
# dc-01 — Samba AD DC config + the deliberate weaknesses register, as code.
# Every mutating step is guarded by an existence check, so the role never resets
# an existing account's password and never appends a duplicate ACE. Safe to
# converge against the live DC; also rebuilds the weaknesses onto a freshly
# provisioned DC.
# ============================================================================

- name: Confirm the AD DC is already provisioned
  ansible.builtin.stat:
    path: "{{ samba_private_db }}"
  register: sam_db

- name: Fail clearly if the domain has not been provisioned
  ansible.builtin.assert:
    that: sam_db.stat.exists
    fail_msg: >-
      dc-01 is not provisioned ({{ samba_private_db }} missing). Domain
      provisioning is a one-shot prerequisite — run `samba-tool domain provision`
      (see the phase-7 role README) before converging this role.
    success_msg: "AD DC is provisioned; converging config + weaknesses."

# --- smb.conf (carries the Phase 4 audit logging that makes attacks visible) ---
- name: Deploy Samba AD DC smb.conf
  ansible.builtin.copy:
    src: smb.conf
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: "0644"
    validate: testparm -s %s
  notify: Restart samba-ad-dc

# --- Active-response: the custom Samba-AD account disabler (rules 100040/100041) ---
# Deploy the AR script as code so it can't drift from the repo (it had been
# hand-deployed; a stale copy is how a bug reaches production unseen). The script
# refuses protected + machine ($) accounts — see phase-4-detection/disable-ad-account.py.
- name: Deploy the disable-ad-account active-response script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../phase-4-detection/disable-ad-account.py"
    dest: /var/ossec/active-response/bin/disable-ad-account
    owner: root
    group: wazuh
    mode: "0750"

# --- Telemetry: ship smbd's SMB/NTLM auth log to Wazuh (password-spray detection) ---
# smbd handles SMB session-setup auth and logs it to log.smbd, NOT log.samba (the AD DC
# process, which is all the Kerberoast/Kerberos-brute rules ever read). Failed SMB logons
# (eventId 4625, serviceDescription "SMB2") were therefore invisible to Wazuh, so a
# password SPRAY (one password across many accounts) went undetected — the per-account
# Kerberos brute rule (100041) can't see it by design. Added as a separate <ossec_config>
# block (Wazuh merges them) so the existing log.samba localfile is left untouched.
# Feeds siem-role rules 100400/100401 (T1110.003 — Password Spraying).
- name: Ship smbd SMB-auth log to Wazuh (password-spray detection telemetry)
  ansible.builtin.blockinfile:
    path: /var/ossec/etc/ossec.conf
    marker: "<!-- {mark} ANSIBLE MANAGED: dc-01 SMB auth log (log.smbd) -->"
    block: |
      <ossec_config>
        <localfile>
          <log_format>json</log_format>
          <location>/var/log/samba/log.smbd</location>
        </localfile>
      </ossec_config>
  notify: Restart wazuh-agent

# --- FIM: SYSVOL/cron/passwd/shadow/sudoers/crontab (T1484.001/T1053.003/T1136.001) ---
# Live-only on dc-01 since Phase 4 (detection-catalog.md's "2 & 5 & 6" sections) -
# never actually codified, despite the rules that consume this telemetry
# (100020/100050/100051) being in local_rules.xml all along. A from-scratch
# rebuild would silently lose real-time FIM on these paths entirely. Closing
# that gap here, and switching passwd/shadow/sudoers/crontab specifically to
# whodata (SYSVOL/cron stay realtime, they don't need it): plain `realtime`
# is inotify-based and watches an inode, not a path, so a file replaced via
# rename() (exactly how useradd/userdel/vipw update /etc/passwd) orphans the
# watch after its first detected change — confirmed live 2026-09-13, see
# detection-catalog.md's T1136.001 section and [[File Integrity Monitoring]]
# in the vault. whodata is audit-backed (tracks by path via auditd, immune to
# the rename gap) at the cost of needing auditd running, which this installs.
- name: Install auditd (required for whodata FIM mode)
  ansible.builtin.apt:
    name: auditd
    state: present

- name: Enable and start auditd
  ansible.builtin.systemd:
    name: auditd
    enabled: true
    state: started

# Real, reproducible finding (2026-09-15): after ANY auditd restart (this playbook,
# a reboot, a manual `systemctl restart auditd`), the audisp-af_unix plugin that
# feeds whodata events to Wazuh tries to bind /var/ossec/queue/sockets/audit and
# fails ("Couldn't bind af_unix socket (Address already in use)") because the
# previous plugin instance's own shutdown-time unlink of that same socket silently
# failed ("Failed to unlink socket ... (Permission denied)") and left it behind.
# auditd retries the plugin 10x, gives up ("has exceeded max_restarts"), and from
# then on wazuh-syscheckd can't reach the audit socket at all — it logs "Who-data
# engine could not start. Switching who-data to real-time." and silently falls
# back to the exact inode-rename-orphans-the-watch bug whodata was built to fix
# (see the comment above). Verified this actually happened live: the passwd/shadow
# FIM scenario in ad-validate.py FAILed on a full battery run right after an
# `ansible-playbook site.yml` restart, even though whodata was correctly deployed.
# Fix: force-remove the stale socket before auditd starts, every time, so the
# plugin always gets a clean bind. `rm -f` on a nonexistent path just no-ops.
- name: Ensure the auditd systemd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/auditd.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy the auditd socket-cleanup drop-in (fixes the af_unix stale-socket race)
  ansible.builtin.copy:
    dest: /etc/systemd/system/auditd.service.d/wazuh-socket-cleanup.conf
    content: |
      [Service]
      ExecStartPre=-/usr/bin/rm -f /var/ossec/queue/sockets/audit
    owner: root
    group: root
    mode: "0644"
  notify: Restart auditd

- name: Real-time/whodata FIM on SYSVOL, cron, and account/credential files
  ansible.builtin.blockinfile:
    path: /var/ossec/etc/ossec.conf
    marker: "<!-- {mark} ANSIBLE MANAGED: dc-01 SYSVOL/cron/account FIM -->"
    block: |
      <ossec_config>
        <syscheck>
          <directories realtime="yes" report_changes="yes">/var/lib/samba/sysvol</directories>
          <directories realtime="yes" report_changes="yes">/etc/cron.d,/etc/cron.daily,/etc/cron.hourly,/etc/cron.weekly,/etc/cron.monthly</directories>
          <directories whodata="yes" report_changes="yes">/etc/passwd,/etc/shadow,/etc/sudoers,/etc/crontab</directories>
        </syscheck>
      </ossec_config>
  notify: Restart wazuh-agent

# --- Accounts (create-only; existing accounts are never touched) --------------
- name: Enumerate current domain users
  ansible.builtin.command: samba-tool user list
  register: samba_users
  changed_when: false

- name: Create deliberately-weak Kerberoastable service accounts + the honeytoken decoy
  ansible.builtin.command: >-
    samba-tool user create {{ item.name }} '{{ item.password }}'
    --description={{ item.description | quote }}
  loop: "{{ dc_service_accounts + dc_honeytoken_accounts }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name not in samba_users.stdout_lines

- name: Create ordinary domain users
  ansible.builtin.command: >-
    samba-tool user create {{ item.name }} '{{ item.password }}'
    --description={{ item.description | quote }}
  loop: "{{ dc_normal_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name not in samba_users.stdout_lines

# --- SPNs (what makes the accounts Kerberoastable) ----------------------------
- name: Read current SPNs per service account
  ansible.builtin.command: samba-tool spn list {{ item.name }}
  loop: "{{ dc_service_accounts + dc_honeytoken_accounts }}"
  loop_control:
    label: "{{ item.name }}"
  register: spn_list
  changed_when: false

- name: Register missing SPNs
  ansible.builtin.command: samba-tool spn add {{ item.item.spn }} {{ item.item.name }}
  loop: "{{ spn_list.results }}"
  loop_control:
    label: "{{ item.item.name }} -> {{ item.item.spn }}"
  when: item.item.spn not in item.stdout

# --- Over-privilege: Backup Operators membership ------------------------------
- name: Read Backup Operators membership
  ansible.builtin.command: samba-tool group listmembers "Backup Operators"
  register: backup_ops
  changed_when: false
  failed_when: false

- name: Add deliberate members to Backup Operators
  ansible.builtin.command: samba-tool group addmembers "Backup Operators" {{ item }}
  loop: "{{ dc_backup_operators_members }}"
  when: item not in (backup_ops.stdout_lines | default([]))

# --- Over-privilege: DCSync rights on the domain NC ---------------------------
- name: Read the domain NC ACL
  ansible.builtin.command: samba-tool dsacl get --objectdn "{{ samba_domain_dn }}"
  register: nc_acl
  changed_when: false

- name: Grant DCSync control-access rights to svc-backup
  ansible.builtin.command: >-
    samba-tool dsacl set --objectdn "{{ samba_domain_dn }}"
    --sddl "(OA;;CR;{{ item }};;{{ dc_dcsync_principal_sid }})"
  loop: "{{ dc_dcsync_guids }}"
  when: "'(OA;;CR;' ~ item ~ ';;' ~ dc_dcsync_principal_sid ~ ')' not in nc_acl.stdout"

# --- Self-verification: prove the desired end state actually holds ------------
- name: Verify service accounts, SPNs, and DCSync grant are all present
  ansible.builtin.shell: |
    set -e
    samba-tool user list | grep -qx svc-backup
    samba-tool user list | grep -qx svc-sql
    samba-tool user list | grep -qx svc-web
    samba-tool group listmembers "Backup Operators" | grep -qx svc-backup
    samba-tool dsacl get --objectdn "{{ samba_domain_dn }}" \
      | grep -qF '(OA;;CR;{{ dc_dcsync_guids[0] }};;{{ dc_dcsync_principal_sid }})'
    echo VERIFIED
  register: dc_verify
  changed_when: false
  failed_when: "'VERIFIED' not in dc_verify.stdout"
