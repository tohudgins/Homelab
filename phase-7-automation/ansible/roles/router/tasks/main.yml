---
# ============================================================================
# rtr-01 — routing, firewall, DHCP/DNS/NTP, and the inline Suricata+Zeek sensor.
# Idempotent: safe to converge against the live box or to rebuild a blank
# Debian 13 ARM64 host into rtr-01 from nothing.
# ============================================================================

- name: Install router packages (firewall, DHCP/DNS, NTP, IDS)
  ansible.builtin.apt:
    name: "{{ router_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

# --- Kernel: turn the host into a router --------------------------------------
- name: Enable IPv4 forwarding (persisted)
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_file: /etc/sysctl.d/99-rtr01-forwarding.conf
    sysctl_set: true
    reload: true

# --- nftables: default-deny firewall + NAT ------------------------------------
- name: Deploy nftables ruleset
  ansible.builtin.copy:
    src: nftables.conf
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0755"
  notify: Reload nftables

- name: Enable and start nftables
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started

# --- dnsmasq: DHCP/DNS for DMZ, SOC, REDTEAM (CORP is dc-01's) ----------------
- name: Deploy dnsmasq config
  ansible.builtin.copy:
    src: dnsmasq.conf
    dest: /etc/dnsmasq.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart dnsmasq

- name: Enable and start dnsmasq
  ansible.builtin.systemd:
    name: dnsmasq
    enabled: true
    state: started

# --- chrony: NTP source for the whole lab (Kerberos needs tight time) ---------
- name: Deploy chrony config
  ansible.builtin.copy:
    src: chrony.conf
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart chrony

- name: Enable and start chrony
  ansible.builtin.systemd:
    name: chrony
    enabled: true
    state: started

# --- Suricata: inline signature IDS (ruleset tuning lives in Phase 6) ---------
# NSM-hygiene: drop `stats` and `flow` from the eve.json feed Wazuh ingests.
# Suricata `stats` events carry ~542 fields (per-counter), which overflow Wazuh's
# analysis JSON decoder — a single stats event every 8s produced a sustained
# ~1500/min "Too many fields for JSON decoder" spam in the manager's ossec.log
# (log-hygiene only; detection was unaffected). `flow` is dropped too: high-volume,
# low SIEM value, and connection-level analysis is Zeek's job (conn.log, Phase 6).
# Both matches are anchored on their eve-log sub-keys so the separate stats.log
# output block is untouched; idempotent (the commented form no longer matches).
- name: Disable Suricata eve-log 'stats' events (542-field events overflow the Wazuh JSON decoder)
  ansible.builtin.replace:
    path: /etc/suricata/suricata.yaml
    regexp: '^(\s*)- stats:\n\s+totals: yes\n\s+threads: no\n\s+deltas: no'
    replace: '\1# - stats:  # DISABLED (roles/router): 542-field stats events overflow the Wazuh JSON decoder'
  notify: Restart suricata

- name: Disable Suricata eve-log 'flow' events (high-volume SIEM noise; Zeek conn.log covers connection-level)
  ansible.builtin.replace:
    path: /etc/suricata/suricata.yaml
    regexp: '^(\s*)- flow$'
    replace: '\1# - flow  # DISABLED (roles/router): high-volume, low SIEM value; use Zeek conn.log'
  notify: Restart suricata

# Explicitly enable JA3/JA3S TLS fingerprinting for DETECTION (not just eve
# logging). In the default 'auto' mode the ja3s.hash detection buffer can go
# unpopulated even while eve logs a ja3s value, so a ja3s.hash rule silently
# never matches. Needed by local.rules sid 9100001 (Sliver Go-TLS JA3S).
- name: Enable JA3/JA3S fingerprinting (TLS app-layer)
  ansible.builtin.replace:
    path: /etc/suricata/suricata.yaml
    regexp: '^(\s*)#?\s*ja3-fingerprints:\s*(auto|no|yes)\s*$'
    replace: '\1ja3-fingerprints: yes'
  notify: Restart suricata

# Teach Suricata that the DMZ web app on :3000 is HTTP. ET Open's web-attack
# signatures match on $HTTP_PORTS (default 80), so out of the box the whole ET
# web ruleset is blind to Juice Shop on 3000. Adding the port fixes that for the
# stock ruleset; the lab's own T1190 rules (local.rules 9100020-24) are scoped
# to 10.10.20.10:3000 directly and don't depend on it, but the ET breadth is
# worth having. Idempotent — after the edit the "[80,3000]" form no longer matches.
- name: Add the DMZ Juice Shop port (3000) to Suricata HTTP_PORTS
  ansible.builtin.replace:
    path: /etc/suricata/suricata.yaml
    regexp: '^(\s*HTTP_PORTS:\s*)"?80"?\s*$'
    replace: '\1"[80,3000]"'
  notify: Restart suricata

# Custom detection-as-code rules (C2/adversary emulation — Sliver; DMZ web
# attacks — T1190). Loaded alongside the ET Open ruleset. Companion to the
# Wazuh local_rules.xml.
- name: Deploy custom Suricata rules (local.rules)
  ansible.builtin.copy:
    src: suricata-local.rules
    dest: /var/lib/suricata/rules/local.rules
    owner: root
    group: root
    mode: "0644"
  notify: Restart suricata

- name: Register local.rules in suricata.yaml rule-files
  ansible.builtin.lineinfile:
    path: /etc/suricata/suricata.yaml
    line: "  - local.rules"
    insertafter: '^\s*-\s*suricata\.rules\s*$'
    firstmatch: true
  notify: Restart suricata

- name: Enable and start suricata
  ansible.builtin.systemd:
    name: suricata
    enabled: true
    state: started

# --- Zeek: protocol-level NSM from the OBS package repo -----------------------
- name: Add Zeek (OBS) apt signing key
  ansible.builtin.get_url:
    url: "{{ zeek_apt_key_url }}"
    dest: /etc/apt/trusted.gpg.d/security_zeek.asc
    mode: "0644"

- name: Add Zeek (OBS) apt repository
  ansible.builtin.apt_repository:
    repo: "{{ zeek_apt_repo }}"
    filename: security:zeek
    state: present
    update_cache: true

- name: Install Zeek
  ansible.builtin.apt:
    name:
      - zeek
      - zeekctl
    state: present

- name: Deploy Zeek node.cfg (standalone on the CORP interface)
  ansible.builtin.copy:
    src: zeek-node.cfg
    dest: "{{ zeek_prefix }}/etc/node.cfg"
    owner: root
    group: root
    mode: "0644"
  notify: Deploy zeek

- name: Deploy Zeek networks.cfg (segment labels)
  ansible.builtin.copy:
    src: zeek-networks.cfg
    dest: "{{ zeek_prefix }}/etc/networks.cfg"
    owner: root
    group: root
    mode: "0644"
  notify: Deploy zeek

- name: Deploy Zeek systemd unit (boot persistence via zeekctl deploy)
  ansible.builtin.copy:
    src: zeek.service
    dest: /etc/systemd/system/zeek.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Deploy zeek

- name: Enable Zeek at boot
  ansible.builtin.systemd:
    name: zeek
    enabled: true
