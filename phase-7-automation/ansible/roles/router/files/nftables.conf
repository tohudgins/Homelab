#!/usr/sbin/nft -f
#
# rtr-01 firewall — written from an empty ruleset, not adapted from a template.
# Default-deny on input and forward; every permitted path below is a deliberate
# decision traceable to docs/00-ip-plan.md and docs/design-decisions.md.
#
# Segment summary (see docs/00-ip-plan.md for the authoritative table):
#   WAN   enp2s0   Fusion NAT (vmnet8)      — uplink, DHCP-assigned
#   CORP  enp26s0  10.10.10.0/24  gw .1     — AD domain, DHCP/DNS owned by dc-01 (Phase 2)
#   DMZ   enp3s0   10.10.20.0/24  gw .1     — vulnerable web apps, DHCP/DNS owned by rtr-01
#   SOC   enp11s0  10.10.30.0/24  gw .1     — Wazuh, DHCP/DNS owned by rtr-01
#   RED   enp19s0  10.10.40.0/24  gw .1     — attacker/scanner, DHCP/DNS owned by rtr-01

flush ruleset

define WAN_IF  = "enp2s0"
define CORP_IF = "enp26s0"
define DMZ_IF  = "enp3s0"
define SOC_IF  = "enp11s0"
define RED_IF  = "enp19s0"

table ip filter {
    chain input {
        type filter hook input priority 0; policy drop;

        iif lo accept
        ct state established,related accept
        ct state invalid drop

        # Basic reachability for troubleshooting/segmentation testing
        icmp type echo-request accept

        # SSH management. Reachable from WAN because Fusion's NAT (not the real
        # internet) is how the Mac reaches this VM in this lab — see
        # Tools/VMware Fusion.md. Revisit if this box is ever exposed for real.
        tcp dport 22 accept

        # DHCP/DNS served by rtr-01's dnsmasq — DMZ/SOC/REDTEAM only.
        # CORP is deliberately excluded: dc-01 owns CORP's DHCP/DNS (Phase 2).
        iifname { $DMZ_IF, $SOC_IF, $RED_IF } udp dport { 67, 53 } accept
        iifname { $DMZ_IF, $SOC_IF, $RED_IF } tcp dport 53 accept

        # NTP (chrony) — every internal segment, including CORP: dc-01 as PDC
        # syncs its time to rtr-01 per the time-sync warning in the build plan.
        iifname { $CORP_IF, $DMZ_IF, $SOC_IF, $RED_IF } udp dport 123 accept

        counter log prefix "nft-input-drop: " drop
    }

    chain forward {
        type filter hook forward priority 0; policy drop;

        ct state established,related accept
        ct state invalid drop

        # CORP: internet + DMZ reachable; SOC reachable only on Wazuh agent ports
        iifname $CORP_IF oifname $WAN_IF accept
        iifname $CORP_IF oifname $DMZ_IF accept
        iifname $CORP_IF oifname $SOC_IF tcp dport { 1514, 1515 } accept

        # DMZ: internet egress for package updates only. No pivot into CORP —
        # these are deliberately vulnerable hosts. Agent ports to SOC only.
        iifname $DMZ_IF oifname $WAN_IF accept
        iifname $DMZ_IF oifname $SOC_IF tcp dport { 1514, 1515 } accept

        # SOC: reaches every segment (Wazuh manager initiating to agents) + WAN
        # for updates. Nothing initiates back into SOC except the lines above.
        iifname $SOC_IF oifname { $CORP_IF, $DMZ_IF, $RED_IF, $WAN_IF } accept

        # REDTEAM: can reach CORP + DMZ (the attack surface) and WAN for
        # tooling — never SOC. The SIEM observing the attack must not be
        # reachable by the box generating it.
        iifname $RED_IF oifname { $CORP_IF, $DMZ_IF, $WAN_IF } accept

        counter log prefix "nft-forward-drop: " drop
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority 100;
        oifname $WAN_IF masquerade
    }
}
