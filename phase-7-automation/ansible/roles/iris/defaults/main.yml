---
# DFIR-IRIS incident-response case-management platform, deployed on misp-01 (SOC
# segment) alongside MISP. arm64-native (app + postgres + nginx + rabbitmq), unlike
# TheHive+Cortex whose images are amd64-only and stack is 4 JVMs — a poor fit for
# this ARM64/24GB host. Reproducible counterpart to the manual 2026-09-02 build.
# The Wazuh -> IRIS alert-forwarding integration lives in the `siem` role
# (custom-iris + the <integration> block).
iris_repo: "https://github.com/dfir-iris/iris-web.git"
iris_version: "v2.4.20"            # pinned; arm64-verified in ghcr for all three images
iris_deploy_dir: /opt/iris-web
iris_https_port: 8443             # MISP already binds 443 on this host

