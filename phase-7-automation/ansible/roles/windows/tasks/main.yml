---
# ============================================================================
# ws-01 — codify the Windows victim endpoint's detection-telemetry sources:
# the Wazuh agent (→ manager), Sysmon (process/network/registry), and PowerShell
# Script Block Logging (event 4104). Managed over SSH with the ansible.windows
# win_* modules. Idempotent.
# ============================================================================

# --- Wazuh agent: install (fresh hosts) → manager ------------------------------
# WAZUH_MANAGER makes the MSI enrol with authd (1515) as WAZUH_AGENT_NAME during
# install. MSI comes from windows-config/fetch-installers.sh, pushed from the control
# node. Existing agents are left alone (creates_path).
- name: Check whether the Wazuh agent is installed
  ansible.windows.win_stat:
    path: "{{ wazuh_agent_exe }}"
  register: wazuh_installed

- name: Stage the Wazuh agent MSI
  ansible.windows.win_copy:
    src: "{{ wazuh_agent_msi }}"
    dest: 'C:\Windows\Temp\wazuh-agent.msi'
  when: not wazuh_installed.stat.exists

- name: Install the Wazuh agent, enrolling with the manager
  ansible.windows.win_package:
    path: 'C:\Windows\Temp\wazuh-agent.msi'
    creates_path: "{{ wazuh_agent_exe }}"
    arguments:
      - /q
      - "WAZUH_MANAGER={{ wazuh_manager_ip }}"
      - "WAZUH_AGENT_NAME={{ wazuh_agent_name }}"
    state: present
  when: not wazuh_installed.stat.exists

- name: Remove the staged Wazuh agent MSI
  ansible.windows.win_file:
    path: 'C:\Windows\Temp\wazuh-agent.msi'
    state: absent

- name: Point the Wazuh agent at the manager
  community.windows.win_lineinfile:
    path: "{{ wazuh_agent_conf }}"
    regexp: '<address>.*</address>'
    line: "      <address>{{ wazuh_manager_ip }}</address>"
  notify: Restart wazuh agent

# A fresh agent only reads Application/Security/System. Without these two channels
# Sysmon and Script Block Logging run but nothing reaches the SIEM, so every Sysmon
# and 4104 detection is silently blind. Insert any missing <localfile> before the
# closing tag (BOM-less UTF-8, as the agent expects). Idempotent: prints CHANGED only
# when it wrote something.
- name: Make the Wazuh agent collect the Sysmon and PowerShell event channels
  ansible.windows.win_shell: |
    $p = '{{ wazuh_agent_conf }}'
    $c = [IO.File]::ReadAllText($p)
    $changed = $false
    foreach ($ch in '{{ wazuh_extra_channels | join("','") }}') {
      if ($c -notmatch [regex]::Escape("<location>$ch</location>")) {
        $blk = "  <localfile>`r`n    <location>$ch</location>`r`n    <log_format>eventchannel</log_format>`r`n  </localfile>`r`n`r`n"
        $i = $c.LastIndexOf('</ossec_config>')
        $c = $c.Insert($i, $blk)
        $changed = $true
      }
    }
    if ($changed) {
      [IO.File]::WriteAllText($p, $c, (New-Object Text.UTF8Encoding($false)))
      'CHANGED'
    }
  register: wazuh_channels
  changed_when: "'CHANGED' in wazuh_channels.stdout"
  notify: Restart wazuh agent

- name: Ensure the Wazuh agent service is running
  ansible.windows.win_service:
    name: WazuhSvc
    start_mode: auto
    state: started

# --- PowerShell Script Block Logging (event 4104) -----------------------------
- name: Enable PowerShell Script Block Logging
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging
    name: EnableScriptBlockLogging
    data: 1
    type: dword

# --- Sysmon -------------------------------------------------------------------
# Install it first if the box is fresh (the Phase-3 install was by hand). The
# ARM64 build registers as Sysmon64a; `-i <config>` installs with the config, so
# a fresh host never runs unconfigured. Installer comes from
# windows-config/fetch-installers.sh (staged on the control node, no guest internet).
#
# Sysmon config as code (SwiftOnSecurity, see windows-config/README.md): already
# live + regression-tested (purple-team.py, including the Sysmon EID 22 DNS
# telemetry it added). Sysmon has no diff/dry-run of its own, so win_copy's checksum
# comparison (gating the reconfigure on its changed result) is what makes this
# idempotent: an unchanged config is a true no-op on the next converge.
- name: Ensure the Sysmon config directory exists
  ansible.windows.win_file:
    path: "{{ sysmon_config_dir }}"
    state: directory

- name: Deploy the Sysmon config (SwiftOnSecurity, incl. EID 22 DNS telemetry)
  ansible.windows.win_copy:
    src: "{{ playbook_dir }}/../windows-config/sysmonconfig.xml"
    dest: "{{ sysmon_config_dest }}"
  register: sysmon_config_copy

- name: Check whether Sysmon is installed
  ansible.windows.win_stat:
    path: "{{ sysmon_exe }}"
  register: sysmon_installed

- name: Stage the Sysmon installer
  ansible.windows.win_copy:
    src: "{{ sysmon_installer }}"
    dest: "{{ sysmon_config_dir }}\\Sysmon64a.exe"
  when: not sysmon_installed.stat.exists

# The staged file MUST keep the name Sysmon64a.exe: Sysmon names its service and
# driver after the executable it is installed from, so a renamed copy registers a
# differently-named service and `sysmon_service` below never exists.
- name: Install Sysmon with the lab config
  ansible.windows.win_command: '"{{ sysmon_config_dir }}\Sysmon64a.exe" -accepteula -i "{{ sysmon_config_dest }}"'
  when: not sysmon_installed.stat.exists

- name: Remove the staged Sysmon installer
  ansible.windows.win_file:
    path: "{{ sysmon_config_dir }}\\Sysmon64a.exe"
    state: absent

- name: Ensure the Sysmon service is running
  ansible.windows.win_service:
    name: "{{ sysmon_service }}"
    start_mode: auto
    state: started

- name: Apply the Sysmon config (only when it changed on an already-installed Sysmon)
  ansible.windows.win_command: '"{{ sysmon_exe }}" -c "{{ sysmon_config_dest }}"'
  when: sysmon_config_copy.changed and sysmon_installed.stat.exists

# --- Time + domain membership: order matters --------------------------------------
# 1. Timezone first. ws-01 shipped set to Pacific while the host/domain are US
#    Eastern; combined with Windows reading the VM RTC as local time, that put its
#    computed UTC ~3h fast, which silently mis-timestamped Sysmon telemetry relative
#    to the SIEM. Kerberos also rejects a >5 minute clock skew, so the zone has to be
#    right before the join.
- name: Set timezone to US Eastern
  community.windows.win_timezone:
    timezone: Eastern Standard Time

# 2. Join the domain (lab.internal, Samba AD on dc-01). The guest's DNS already points
#    at dc-01 (firstlogon.ps1 sets it), which the join needs to find the domain.
#    Already-joined hosts are a no-op. `windows_hostname` is also the computer name
#    the join gives the machine, so a rebuild can be tested under a different name
#    without touching the real ws-01's computer account.
- name: Flush pending handlers before a possible reboot
  ansible.builtin.meta: flush_handlers

- name: Join the AD domain (renaming the machine if needed), rebooting if it changed
  microsoft.ad.membership:
    dns_domain_name: "{{ windows_domain }}"
    hostname: "{{ windows_hostname }}"
    domain_admin_user: "{{ windows_domain_admin }}@{{ windows_domain }}"
    domain_admin_password: "{{ hostvars['dc-01'].dc_domain_admin_password }}"
    state: domain
    reboot: true
    reboot_timeout: 900
  no_log: true

# 3. w32time last. Joining a domain resets w32time's Type to NT5DS (domain
#    hierarchy), so configuring it before the join means the next converge has to
#    redo it. Point it at rtr-01 (10.10.10.1 — the lab's chrony NTP server, the same
#    address dnsmasq hands out per segment). All registry-based so it is idempotent
#    (win_shell w32tm /config would report "changed" every run).
- name: Point w32time at rtr-01 as its NTP peer
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\W32Time\Parameters
    name: "{{ item.name }}"
    data: "{{ item.data }}"
    type: string
  loop:
    - { name: NtpServer, data: "{{ ntp_server }},0x9" }
    - { name: Type, data: NTP }
  notify: Restart w32time

- name: Allow w32time to correct an arbitrarily large offset (self-heal after drift)
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\W32Time\Config
    name: "{{ item }}"
    data: 4294967295
    type: dword
  loop:
    - MaxPosPhaseCorrection
    - MaxNegPhaseCorrection
  notify: Restart w32time

- name: Ensure the Windows Time service is running
  ansible.windows.win_service:
    name: w32time
    start_mode: auto
    state: started

# --- Active Response: kill the offending process on a high-confidence LOLBin alert ---
# The manager (siem role) wires these scripts to rules 100114-100116 via ossec.conf. remove-threat.ps1
# reads the AR alert JSON from stdin and kills the process id it names. Two hard-won details are baked
# into the script: read ONE line with a timeout (never ReadToEnd(), which hangs the agent's single
# execd thread since execd sends no EOF), and log via FileShare.ReadWrite (logcollector holds the file).
- name: Deploy the remove-threat active-response scripts to the agent
  ansible.windows.win_copy:
    src: "{{ item }}"
    dest: 'C:\Program Files (x86)\ossec-agent\active-response\bin\{{ item }}'
  loop:
    - remove-threat.cmd
    - remove-threat.ps1

# --- Lateral-movement reachability: infra fixes found live 2026-09-07 ---------
# Nothing had ever attempted live inbound lateral movement (WMI/WinRM/PsExec) against
# ws-01 before the Phase 5 exercise, and it surfaced three real gaps that blocked
# REDTEAM from reaching the host at all. Applied by hand over SSH at the time; codified
# here so a rebuild doesn't silently lose them. See
# phase-5-offense/attack-detect-writeups/04-lateral-movement-wmi-winrm-psexec.md §5.
- name: Check for any disabled rules in the File and Printer Sharing / WMI firewall groups
  ansible.windows.win_shell: >
    (Get-NetFirewallRule -DisplayGroup 'File and Printer Sharing','Windows Management Instrumentation (WMI)' |
    Where-Object Enabled -eq $false).Count
  register: ws_fw_disabled_count
  changed_when: false

- name: Enable the File and Printer Sharing / WMI firewall rule groups (disabled by the base image for every profile)
  ansible.windows.win_shell: >
    Enable-NetFirewallRule -DisplayGroup 'File and Printer Sharing','Windows Management Instrumentation (WMI)'
  when: ws_fw_disabled_count.stdout | trim | int > 0

- name: Check ws-01's current network connection category
  ansible.windows.win_shell: (Get-NetConnectionProfile).NetworkCategory
  register: ws_net_category
  changed_when: false

- name: Set the network profile to Private (stale NLA detection misclassified it Public, hiding the rule groups above regardless of their enabled state)
  ansible.windows.win_shell: Get-NetConnectionProfile | Set-NetConnectionProfile -NetworkCategory Private
  when: "'Public' in ws_net_category.stdout"

- name: Check the SMB-In rule's current remote-address scope
  ansible.windows.win_shell: (Get-NetFirewallRule -DisplayName 'File and Printer Sharing (SMB-In)' | Get-NetFirewallAddressFilter).RemoteAddress
  register: ws_smb_scope
  changed_when: false

- name: Widen the SMB-In rule's remote scope past LocalSubnet (REDTEAM traffic arrives routed through rtr-01, not same-subnet)
  ansible.windows.win_shell: Get-NetFirewallRule -DisplayName 'File and Printer Sharing (SMB-In)' | Set-NetFirewallRule -RemoteAddress Any
  when: "'LocalSubnet' in ws_smb_scope.stdout"

- name: Allow a non-Administrator local admin account to authenticate remotely with a full token (LocalAccountTokenFilterPolicy)
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
    name: LocalAccountTokenFilterPolicy
    data: 1
    type: dword

# --- Soft verification (informational; log may have rotated) ------------------
- name: Report the agent's last "Connected to the server" log line
  ansible.windows.win_shell: Select-String -Path 'C:\Program Files (x86)\ossec-agent\ossec.log' -Pattern 'Connected to the server' | Select-Object -Last 1 -ExpandProperty Line
  register: ws_connected
  changed_when: false
  failed_when: false

- name: Show agent connection status
  ansible.builtin.debug:
    msg: "{{ ws_connected.stdout | default('') | trim }}"
