---
# ============================================================================
# misp-01 — deploy the MISP threat-intel platform from the official
# MISP/misp-docker stack (arm64-native). Reproducible counterpart to the manual
# 2026-08-29 build; the base VM comes from provisioning/misp-01/ (autoinstall).
# MISP is the professional TIP that becomes the IOC source of truth feeding
# Wazuh (the MISP->Wazuh integratord integration is a separate role/step).
# ============================================================================

- name: Install Docker Engine + compose plugin (official convenience script)  # noqa: command-instead-of-module
  # The upstream get.docker.com convenience script — a pipe-to-shell installer, not a module target.
  ansible.builtin.shell: curl -fsSL https://get.docker.com | sh
  args:
    creates: /usr/bin/docker
  become: true

- name: Add the login user to the docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
  become: true

- name: Clone the official misp-docker stack
  ansible.builtin.git:
    repo: "{{ misp_repo }}"
    dest: "{{ misp_deploy_dir }}"
    depth: 1
    version: master
  become: true

# Seed .env from the shipped template ONCE, then set the lab values. force:false
# keeps a later hand-edit / generated secrets from being clobbered on re-run.
- name: Seed .env from template.env (first run only)
  ansible.builtin.copy:
    src: "{{ misp_deploy_dir }}/template.env"
    dest: "{{ misp_deploy_dir }}/.env"
    remote_src: true
    force: false
    mode: "0640"
  become: true

- name: Configure .env essentials (base URL, admin, GPG passphrase)
  ansible.builtin.lineinfile:
    path: "{{ misp_deploy_dir }}/.env"
    regexp: "^{{ item.k }}="
    line: "{{ item.k }}={{ item.v }}"
  loop:
    - { k: "BASE_URL", v: "{{ misp_base_url }}" }
    - { k: "ADMIN_EMAIL", v: "{{ misp_admin_email }}" }
    - { k: "ADMIN_PASSWORD", v: "{{ misp_admin_password }}" }
    - { k: "ADMIN_ORG", v: "{{ misp_admin_org }}" }
    - { k: "GPG_PASSPHRASE", v: "{{ misp_gpg_passphrase }}" }
  loop_control:
    label: "{{ item.k }}"
  become: true

- name: Pull the MISP images (arm64)
  ansible.builtin.command:
    cmd: docker compose pull
    chdir: "{{ misp_deploy_dir }}"
  become: true
  changed_when: false

- name: Bring up the MISP stack
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ misp_deploy_dir }}"
  become: true
  register: misp_up
  changed_when: "'Started' in misp_up.stderr or 'Created' in misp_up.stderr"

# Real, reproducible bug (found 2026-09-20): the self-signed key.pem the
# misp-docker stack generates on first run ships root-only (0600), but the
# misp-nginx container runs as uid/gid 101, not root (see docker-compose.yml's
# tmpfs uid=101,gid=101 on that service) — it can never read its own TLS key.
# This went unnoticed for weeks because the container simply never restarted
# after its first successful boot; it only surfaced once something else (the
# docker0-bridge fix above) forced a real restart, and nginx crash-looped on
# "cannot load certificate key ... BIO_new_file() failed" instead of coming
# back up. Fixed live 2026-09-20, then codified here — group-readable by 101,
# not world-readable, keeps the key from being any more exposed than it needs
# to be while still letting nginx actually read it.
- name: Fix the MISP TLS key's permission (nginx runs as uid/gid 101, key.pem ships root-only)
  ansible.builtin.file:
    path: "{{ misp_deploy_dir }}/ssl/key.pem"
    group: "101"
    mode: "0640"
  become: true
  register: misp_key_perm

- name: Restart misp-nginx if its key permission just changed (it crash-loops on a stale unreadable key)
  ansible.builtin.command: docker restart misp-docker-misp-nginx-1
  become: true
  when: misp_key_perm.changed

- name: Wait for the MISP web UI to answer
  # Pre-existing bug found 2026-09-20: this checked misp-core's OWN loopback,
  # but misp-core only runs PHP-FPM (no netstat/ss even installed in the
  # image, confirmed live) — it never listens on 80 or 443 itself. TLS
  # termination and the actual HTTP listener are the separate misp-nginx
  # sidecar, which proxies to misp-core over FastCGI on the shared docker
  # network. This task could never have passed as written; it silently never
  # got exercised again after the original 2026-08-29 build (re-running
  # ansible-playbook misp.yml against a live host is rare) until this
  # session's reliability pass re-ran it and it hung for its full 30x20s
  # retry budget every time. Checking the host's own port 443 (what nginx
  # actually publishes) is both correct and simpler — no docker exec needed.
  #
  # Short budget on this first attempt (not the full 600s): if the stack is
  # just cold-starting, nginx's own plain-HTTP healthcheck (a separate,
  # container-internal probe Docker runs on its own) reliably goes healthy
  # within seconds — so a real cold start doesn't need long here. A wedge
  # (see the next task) hangs on the very first attempt regardless of how
  # long you wait, so failing fast and remediating beats burning the full
  # budget on something that will never resolve itself. Explicit `timeout`
  # matters: the uri module's own default is 30s per request, which against
  # a wedge (a TLS handshake that hangs until timeout, not a fast refusal)
  # made the very first live test of this task take ~625s instead of the
  # intended ~2min before it gave up and moved on to remediation.
  ansible.builtin.uri:
    url: "https://127.0.0.1/users/login"
    validate_certs: false
    status_code: [200, 302]
    timeout: 5
  register: misp_web
  until: misp_web.status in [200, 302]
  retries: 15
  delay: 5
  ignore_errors: true

# Real, reproducible bug found 2026-09-20, separate from (and more specific
# than) the docker0-bridge finding on dmz-01: after a VMware suspend/resume,
# `docker-proxy` (Docker's userland process forwarding published host ports
# into a container) can wedge — it keeps LISTENing and accepting TCP
# connections, but never forwards them, so a client's TLS handshake hangs
# until it times out. Every other signal looks completely healthy the whole
# time: `docker ps` shows every container "Up ... (healthy)" with 0 restarts,
# nginx's own container-internal healthcheck (plain HTTP, not published)
# succeeds every ~30s the entire time, and the container IPs behind the
# iptables DNAT rules are correct — this is specifically the host-level
# docker-proxy processes for the *published* ports getting stuck, invisible
# to every container-level health signal. `systemctl restart docker`
# respawns docker-proxy fresh and clears it — confirmed live: restarting
# just the nginx *container* did NOT fix it (its docker-proxy listener is a
# separate, longer-lived host process Docker doesn't necessarily recreate on
# a container-only restart), only a full daemon restart did.
- name: Restart Docker if the web UI still isn't answering (docker-proxy can wedge after a VM suspend/resume)
  ansible.builtin.systemd:
    name: docker
    state: restarted
  become: true
  when: misp_web is failed

- name: Re-check the MISP web UI after the Docker-restart remediation
  ansible.builtin.uri:
    url: "https://127.0.0.1/users/login"
    validate_certs: false
    status_code: [200, 302]
  register: misp_web_retry
  until: misp_web_retry.status in [200, 302]
  retries: 30
  delay: 20
  when: misp_web is failed

# Feeds (CIRCL OSINT, abuse.ch Feodo/URLhaus) are enabled + fetched once via the
# API/CLI after first boot — a stateful, one-time action, documented in the
# writeup rather than run on every converge. See phase-8-threat-intel/.
