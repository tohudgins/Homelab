---
# osquery — install from the official upstream apt repo (real arm64 packages,
# confirmed: pkg.osquery.io/deb redirects to pkg.osquerypackages.com, which
# publishes an arm64 Packages index alongside amd64), configure the scheduled
# query pack, run it as its own systemd service, then feed the results log to
# Wazuh in tail-only mode.

- name: Add the osquery apt signing key
  ansible.builtin.get_url:
    url: "{{ osquery_apt_key_url }}"
    dest: /tmp/osquery-pubkey.gpg
    mode: "0644"

- name: Dearmor the osquery signing key into the apt keyring
  ansible.builtin.command: gpg --dearmor -o {{ osquery_apt_keyring }} /tmp/osquery-pubkey.gpg
  args:
    creates: "{{ osquery_apt_keyring }}"

- name: Add the osquery apt repo
  ansible.builtin.copy:
    content: "{{ osquery_apt_repo }}\n"
    dest: /etc/apt/sources.list.d/osquery.list
    owner: root
    group: root
    mode: "0644"

- name: Install osquery
  ansible.builtin.apt:
    name: osquery
    state: present
    update_cache: true

- name: Deploy the scheduled query pack (osquery.conf)
  ansible.builtin.copy:
    src: osquery.conf
    dest: "{{ osquery_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart osqueryd

- name: Deploy osqueryd's persistent flags (logger plugin/path, UTC timestamps)
  ansible.builtin.copy:
    src: osquery.flags
    dest: "{{ osquery_flags_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart osqueryd

- name: Enable and start osqueryd
  ansible.builtin.systemd:
    name: osqueryd
    enabled: true
    state: started

# logged_in_users reads the legacy binary utmp file (glibc getutxent()) — verified
# live (2026-09-23) that nothing on this Ubuntu 26.04 image writes it at all, even
# across a held-open session spanning a full osquery polling interval: no
# pam_lastlog.so exists anywhere on the system (Ubuntu has fully retired it),
# there's no sysvinit boot script to create /run/utmp under systemd, and the two
# real successors Ubuntu now ships (libpam-lastlog2, libpam-wtmpdb) both record to
# their own SQLite database, not the legacy file — installing either does NOT
# make /run/utmp reappear, confirmed by testing wtmpdb specifically. This is a
# genuine osquery/OS version gap (its Linux table implementation predates the
# lastlog2/wtmpdb transition), not a misconfiguration — left open in
# phase-4-detection/osquery/README.md. wtmpdb is still installed here because
# real, modern, persistent login auditing (`wtmpdb last`) is a genuine capability
# this lab didn't have at all before, independent of osquery.
- name: Install libpam-wtmpdb for real login auditing (does not restore osquery's logged_in_users — see above)
  ansible.builtin.apt:
    name: libpam-wtmpdb
    state: present
  # Debian's pam-auth-update auto-enables this profile on install (its
  # /usr/share/pam-configs/wtmpdb ships "Default: yes") — confirmed live,
  # /etc/pam.d/common-session picked up "session optional pam_wtmpdb.so" with no
  # further action needed. No explicit pam-auth-update task required.

# Wazuh's osquery wodle in "monitor an externally-run osqueryd" mode: run_daemon:no
# means the agent never spawns/manages the osqueryd process itself (that's this
# role's systemd service, above) — it only tails log_path and forwards each result
# line as a Wazuh event. config_path is still required by the wodle's schema even
# though it's unused in this mode.
- name: Feed osquery's results log to Wazuh (monitor-only, doesn't manage the daemon)
  ansible.builtin.blockinfile:
    path: /var/ossec/etc/ossec.conf
    marker: "<!-- {mark} ANSIBLE MANAGED: osquery wodle -->"
    block: |
      <ossec_config>
        <wodle name="osquery">
          <disabled>no</disabled>
          <run_daemon>no</run_daemon>
          <log_path>{{ osquery_results_log }}</log_path>
          <config_path>{{ osquery_config_path }}</config_path>
          <add_labels>yes</add_labels>
        </wodle>
      </ossec_config>
  notify: Restart wazuh-agent

# Wires wtmpdb (installed above) into Wazuh: closes "wiring wtmpdb into Wazuh is
# real, separate follow-up work" from osquery/README.md and threat-hunting/README.md
# (Hunt D). See wtmpdb-wazuh-feed.py's own header for why this exists as a dedicated
# feed rather than relying on Wazuh's stock full_command "last -n 20" localfile
# (rule 535) — confirmed live that rule already fires on this OS since `last` now
# reads wtmpdb transparently, but only as one opaque text diff per change, level 1,
# with no user/tty/host fields to alert on.
- name: Create the wtmpdb-wazuh-feed state directory
  ansible.builtin.file:
    path: /var/lib/wtmpdb-wazuh-feed
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Deploy wtmpdb-wazuh-feed.py
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../phase-4-detection/osquery/wtmpdb-wazuh-feed.py"
    dest: /usr/local/sbin/wtmpdb-wazuh-feed.py
    owner: root
    group: root
    mode: "0750"

- name: Schedule the wtmpdb-wazuh-feed cron job (every 5 minutes)
  ansible.builtin.cron:
    name: "wtmpdb -> Wazuh feed"
    user: root
    minute: "*/5"
    job: "/usr/local/sbin/wtmpdb-wazuh-feed.py >> /var/log/wtmpdb-wazuh-feed.log 2>&1"

- name: Feed new wtmpdb sessions to Wazuh (structured JSON, one event per session)
  ansible.builtin.blockinfile:
    path: /var/ossec/etc/ossec.conf
    marker: "<!-- {mark} ANSIBLE MANAGED: wtmpdb wazuh feed -->"
    block: |
      <ossec_config>
        <localfile>
          <log_format>json</log_format>
          <location>/var/log/wtmpdb-events.log</location>
        </localfile>
      </ossec_config>
  notify: Restart wazuh-agent

# Lab-created logs had no rotation at all (2026-09-27 audit) — unbounded growth on
# a lab meant to run indefinitely. delaycompress keeps the just-rotated file
# plain text so a Wazuh localfile tailing it can finish reading after rotation.
# su root root is required, not optional: /var/log is 0775 root:syslog on this
# image, which logrotate treats as an insecure parent and silently REFUSES to
# rotate into without an explicit rotation identity (verified live 2026-09-28).
- name: Rotate wtmpdb feed logs
  ansible.builtin.copy:
    dest: /etc/logrotate.d/homelab-wtmpdb
    owner: root
    group: root
    mode: "0644"
    content: |
      /var/log/wtmpdb-events.log
      /var/log/wtmpdb-wazuh-feed.log {
        su root root
        weekly
        rotate 8
        compress
        delaycompress
        missingok
        notifempty
      }
