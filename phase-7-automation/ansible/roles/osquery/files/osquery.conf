{
  "options": {
    "logger_plugin": "filesystem",
    "logger_path": "/var/log/osquery",
    "disable_events": "false",
    "utc": "true"
  },
  "schedule": {
    "os_version":       { "query": "SELECT name, version, platform FROM os_version;", "interval": 3600 },
    "users":            { "query": "SELECT username, uid, gid, shell FROM users WHERE uid >= 1000 OR username = 'root';", "interval": 3600 },
    "listening_ports":  { "query": "SELECT pid, port, address, protocol FROM listening_ports WHERE family != 1;", "interval": 300 },
    "processes":        { "query": "SELECT pid, name, path, cmdline, parent, uid FROM processes;", "interval": 300 },
    "crontab":          { "query": "SELECT command, path, minute, hour, day_of_month, month, day_of_week FROM crontab;", "interval": 300 },
    "logged_in_users":  { "query": "SELECT type, user, host, tty, time FROM logged_in_users;", "interval": 300 }
  }
}
