---
# ============================================================================
# fs-01 — Samba domain member + the deliberately weak [public] share that leaks
# svc-backup's cleartext credential (the intended lateral-movement path), plus
# the Wazuh agent + realtime FIM that make tampering with the bait visible.
# Idempotent; assumes the host is already domain-joined.
# ============================================================================

- name: Confirm fs-01 is domain-joined
  ansible.builtin.command: net ads testjoin
  register: fs_testjoin
  changed_when: false
  failed_when: "'Join is OK' not in fs_testjoin.stdout"
  # Joining is a one-shot prerequisite: `net ads join -U administrator`
  # (needs domain-admin creds). See the role README.

# --- Samba member config + the weak share ------------------------------------
- name: Deploy Samba member smb.conf (weak [public] share + full_audit)
  ansible.builtin.copy:
    src: smb.conf
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: "0644"
    validate: testparm -s %s
  notify: Restart samba

- name: Ensure the weak share directory exists
  ansible.builtin.file:
    path: "{{ fileserver_share_path }}"
    state: directory
    owner: root
    group: "{{ fileserver_share_group }}"
    mode: "2775"

- name: Plant the bait credential file (the intended lateral-movement path)
  ansible.builtin.copy:
    src: map-backup-share.ps1
    dest: "{{ fileserver_share_path }}/map-backup-share.ps1"
    owner: root
    group: "{{ fileserver_share_group }}"
    mode: "0664"

- name: Ensure Samba services are enabled and running
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ fileserver_samba_services }}"

# --- Wazuh agent + realtime FIM on the share ---------------------------------
- name: Install the Wazuh GPG key (dearmored)
  ansible.builtin.shell: |
    set -o pipefail
    curl -s {{ wazuh_apt_key_url }} | gpg --dearmor > /usr/share/keyrings/wazuh.gpg
  args:
    creates: /usr/share/keyrings/wazuh.gpg
    executable: /bin/bash

- name: Add the Wazuh apt repository
  ansible.builtin.apt_repository:
    repo: "{{ wazuh_apt_repo }}"
    filename: wazuh
    state: present
    update_cache: true

- name: Install the Wazuh agent (pinned, manager preconfigured)
  ansible.builtin.apt:
    name: "wazuh-agent={{ wazuh_agent_version }}"
    state: present
  environment:
    WAZUH_MANAGER: "{{ wazuh_manager_ip }}"

- name: Hold the agent at the manager's version (no silent drift)
  ansible.builtin.dpkg_selections:
    name: wazuh-agent
    selection: hold

- name: Point the agent at the Wazuh manager
  ansible.builtin.lineinfile:
    path: /var/ossec/etc/ossec.conf
    regexp: '<address>.*</address>'
    line: "      <address>{{ wazuh_manager_ip }}</address>"
  notify: Restart wazuh-agent

- name: Realtime FIM on the weak share + the ransomware canary
  ansible.builtin.blockinfile:
    path: /var/ossec/etc/ossec.conf
    marker: "<!-- {mark} ANSIBLE MANAGED: fs-01 share FIM -->"
    block: |
      <ossec_config>
        <syscheck>
          <directories check_all="yes" report_changes="yes" realtime="yes">{{ fileserver_share_path }}</directories>
          <directories check_all="yes" report_changes="yes" realtime="yes">{{ fileserver_canary_path }}</directories>
        </syscheck>
      </ossec_config>
  notify: Restart wazuh-agent

# --- Ransomware canary (T1486): decoy "finance records" nobody legitimately touches ---
- name: Create the ransomware canary directory
  ansible.builtin.file:
    path: "{{ fileserver_canary_path }}"
    state: directory
    mode: "0770"

- name: Seed valuable-looking decoy files into the canary (create-only)
  ansible.builtin.copy:
    dest: "{{ fileserver_canary_path }}/{{ item }}"
    content: "DECOY — homelab ransomware canary. Not real data. Any change here is an incident.\n"
    mode: "0660"
    force: false
  loop: "{{ fileserver_canary_files }}"

# Endpoint detection for a dropped C2 implant / malware executing from a
# world-writable path (the gap the Phase 8 Sliver hunt exposed: an in-memory
# beacon run from /tmp was invisible to the host agent). A local logcollector
# command walks /proc/*/exe every 30s and reports any process whose backing
# binary lives in /tmp, /dev/shm, /var/tmp, or has been deleted-while-running
# (a classic evasion). Local ossec.conf command → runs without remote_commands.
# Paired with Wazuh rule 100200 (siem role local_rules.xml).
- name: Endpoint command monitor — process executing from a world-writable path
  ansible.builtin.blockinfile:
    path: /var/ossec/etc/ossec.conf
    marker: "<!-- {mark} ANSIBLE MANAGED: fs-01 suspicious-exec monitor -->"
    block: |
      <ossec_config>
        <localfile>
          <log_format>full_command</log_format>
          <alias>susp-exec-path</alias>
          <command>for e in /proc/[0-9]*/exe; do t=$(readlink "$e" 2>/dev/null); case "$t" in /tmp/*|/dev/shm/*|/var/tmp/*|*"(deleted)") d=${e%/exe}; echo "susp-exec path=$t pid=${d##*/}";; esac; done</command>
          <frequency>30</frequency>
        </localfile>
      </ossec_config>
  notify: Restart wazuh-agent

# --- YARA-on-FIM: scan files written to the share against malware signatures ---
# FIM says "a file changed on the share"; YARA says "and it matches known-malicious
# signatures". Rule 100450 (a share-scoped syscheck child) triggers the `yara`
# active-response, which runs yara.sh on the changed file; a match writes a
# `wazuh-yara:` line to active-responses.log → shipped to the manager → decoded →
# rule 100460 (malware alert). jq parses the AR JSON robustly.
- name: Install YARA + jq (for the FIM malware-scan active response)
  ansible.builtin.apt:
    name:
      - yara
      - jq
    state: present
    update_cache: true

- name: Create the YARA ruleset directory
  ansible.builtin.file:
    path: /var/ossec/ruleset/yara/rules
    state: directory
    mode: "0750"

- name: Deploy the YARA ruleset
  ansible.builtin.copy:
    src: malware.yar
    dest: /var/ossec/ruleset/yara/rules/malware.yar
    mode: "0640"
  notify: Restart wazuh-agent

- name: Deploy the YARA active-response script
  ansible.builtin.copy:
    src: yara.sh
    dest: /var/ossec/active-response/bin/yara
    owner: root
    group: wazuh
    mode: "0750"

- name: Ship the active-response log to the manager (carries YARA scan results)
  ansible.builtin.blockinfile:
    path: /var/ossec/etc/ossec.conf
    marker: "<!-- {mark} ANSIBLE MANAGED: fs-01 active-response log -->"
    block: |
      <ossec_config>
        <localfile>
          <log_format>syslog</log_format>
          <location>/var/ossec/logs/active-responses.log</location>
        </localfile>
      </ossec_config>
  notify: Restart wazuh-agent

- name: Enable and start the Wazuh agent
  ansible.builtin.systemd:
    name: wazuh-agent
    enabled: true
    state: started

# --- Deliberate weakness (T1548.003): sudo/GTFOBins privesc via `find` -------
# A local support/ops account granted NOPASSWD sudo on `find` (a common real-
# world grant — "let ops search logs/files without full root") is exploitable
# via the well-known GTFOBins escape (`find ... -exec /bin/sh`), spawning a
# root shell. The weakness itself stays in place deliberately — same idiom as
# Phase 2's Kerberoastable service accounts, not a throwaway test fixture.
- name: Create the ops-logview local support account (the deliberate privesc target)
  ansible.builtin.user:
    name: "{{ fileserver_privesc_user }}"
    comment: "{{ fileserver_privesc_user_comment }}"
    shell: /bin/bash
    create_home: true
    state: present

- name: Grant NOPASSWD sudo on find (the deliberate weakness)
  ansible.builtin.copy:
    dest: /etc/sudoers.d/ops-logview-find
    content: |
      # Deliberate weakness (T1548.003) — see
      # phase-5-offense/attack-detect-writeups/05-linux-sudo-privesc-t1548.003.md
      {{ fileserver_privesc_user }} ALL=(root) NOPASSWD: /usr/bin/find
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"

# --- Detection: auditd execve auditing keyed on the find GTFOBins vector (T1548.003) ---
# First cut of this rule watched ANY execve at euid=0 with a non-root `auid`
# (the audit login uid, set once at login and immutable across su/sudo/setuid
# — unlike euid, an attacker can't reset it by escalating privilege). Verified
# live that this is real signal for a GTFOBins escape, but also real NOISE:
# Ubuntu's /etc/update-motd.d/* scripts run entirely as root on every single
# SSH login (any admin, not just an attacker), and legitimately execve `find`/
# `cat`/`sh`/etc. with the logging-in user's non-root auid the whole way
# through — auditd has no cheap way to tell "root process spawned by routine
# login machinery" from "root process spawned by a privesc" without full
# parent-process-name correlation, which plain auditd rules don't give you
# (only a raw ppid, not the parent's exe path) — the same class of limitation
# that made the Windows-side T1047 WMI rule need a hand-written parent-lineage
# rule instead of a simple field match. Narrowed to the actual weaponization
# signal instead: `find` invoked with `-exec`/`-execdir`/`-ok`/`-okdir` is the
# GTFOBins pattern (a legitimate "search files" grant never needs it) — the
# same idiom published Sigma GTFOBins rules use. auditd can't filter argv
# substrings at the kernel level, so this rule captures every root-euid `find`
# call (including MOTD's own benign ones) and the Wazuh rule (local_rules.xml)
# does the precise -exec/-execdir/-ok/-okdir match on the decoded command
# line. This is a genuinely new telemetry path for the homelab: every other
# auditd use so far (the `dc` role) is Wazuh's own whodata FIM plumbing (a
# dedicated af_unix socket for file-watch events); this ingests the raw audit
# log as text via Wazuh's stock `audit` log_format for general process
# auditing, which whodata never touches.
- name: Install auditd
  ansible.builtin.apt:
    name: auditd
    state: present

- name: Deploy the sudo-find-as-root auditd rule
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/wazuh-root-shell.rules
    content: |
      -a always,exit -F arch=b64 -S execve -F exe=/usr/bin/find -F euid=0 -F auid!=0 -F auid!=4294967295 -k sudo_find_as_root
    owner: root
    group: root
    mode: "0640"
  notify: Restart auditd

- name: Enable and start auditd
  ansible.builtin.systemd:
    name: auditd
    enabled: true
    state: started

- name: Ship the raw audit log to the manager (Wazuh's stock auditd decoder parses it)
  ansible.builtin.blockinfile:
    path: /var/ossec/etc/ossec.conf
    marker: "<!-- {mark} ANSIBLE MANAGED: fs-01 auditd execve log -->"
    block: |
      <ossec_config>
        <localfile>
          <log_format>audit</log_format>
          <location>/var/log/audit/audit.log</location>
        </localfile>
      </ossec_config>
  notify: Restart wazuh-agent

# --- Verify -------------------------------------------------------------------
- name: Verify the [public] share is exported and the bait is present
  ansible.builtin.shell: |
    set -e
    testparm -s 2>/dev/null | grep -q '\[public\]'
    test -f {{ fileserver_share_path }}/map-backup-share.ps1
    grep -q 'svc-backup' {{ fileserver_share_path }}/map-backup-share.ps1
    echo VERIFIED
  register: fs_verify
  changed_when: false
  failed_when: "'VERIFIED' not in fs_verify.stdout"
