---
# ============================================================================
# fs-01 — Samba domain member + the deliberately weak [public] share that leaks
# svc-backup's cleartext credential (the intended lateral-movement path), plus
# the Wazuh agent + realtime FIM that make tampering with the bait visible.
# Idempotent; assumes the host is already domain-joined.
# ============================================================================

- name: Confirm fs-01 is domain-joined
  ansible.builtin.command: net ads testjoin
  register: fs_testjoin
  changed_when: false
  failed_when: "'Join is OK' not in fs_testjoin.stdout"
  # Joining is a one-shot prerequisite: `net ads join -U administrator`
  # (needs domain-admin creds). See the role README.

# --- Samba member config + the weak share ------------------------------------
- name: Deploy Samba member smb.conf (weak [public] share + full_audit)
  ansible.builtin.copy:
    src: smb.conf
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: "0644"
    validate: testparm -s %s
  notify: Restart samba

- name: Ensure the weak share directory exists
  ansible.builtin.file:
    path: "{{ fileserver_share_path }}"
    state: directory
    owner: root
    group: "{{ fileserver_share_group }}"
    mode: "2775"

- name: Plant the bait credential file (the intended lateral-movement path)
  ansible.builtin.copy:
    src: map-backup-share.ps1
    dest: "{{ fileserver_share_path }}/map-backup-share.ps1"
    owner: root
    group: "{{ fileserver_share_group }}"
    mode: "0664"

- name: Ensure Samba services are enabled and running
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ fileserver_samba_services }}"

# --- Wazuh agent + realtime FIM on the share ---------------------------------
- name: Install the Wazuh GPG key (dearmored)
  ansible.builtin.shell: |
    set -o pipefail
    curl -s {{ wazuh_apt_key_url }} | gpg --dearmor > /usr/share/keyrings/wazuh.gpg
  args:
    creates: /usr/share/keyrings/wazuh.gpg
    executable: /bin/bash

- name: Add the Wazuh apt repository
  ansible.builtin.apt_repository:
    repo: "{{ wazuh_apt_repo }}"
    filename: wazuh
    state: present
    update_cache: true

- name: Install the Wazuh agent (pinned, manager preconfigured)
  ansible.builtin.apt:
    name: "wazuh-agent={{ wazuh_agent_version }}"
    state: present
  environment:
    WAZUH_MANAGER: "{{ wazuh_manager_ip }}"

- name: Hold the agent at the manager's version (no silent drift)
  ansible.builtin.dpkg_selections:
    name: wazuh-agent
    selection: hold

- name: Point the agent at the Wazuh manager
  ansible.builtin.lineinfile:
    path: /var/ossec/etc/ossec.conf
    regexp: '<address>.*</address>'
    line: "      <address>{{ wazuh_manager_ip }}</address>"
  notify: Restart wazuh-agent

- name: Realtime FIM on the weak share + the ransomware canary
  ansible.builtin.blockinfile:
    path: /var/ossec/etc/ossec.conf
    marker: "<!-- {mark} ANSIBLE MANAGED: fs-01 share FIM -->"
    block: |
      <ossec_config>
        <syscheck>
          <directories check_all="yes" report_changes="yes" realtime="yes">{{ fileserver_share_path }}</directories>
          <directories check_all="yes" report_changes="yes" realtime="yes">{{ fileserver_canary_path }}</directories>
        </syscheck>
      </ossec_config>
  notify: Restart wazuh-agent

# --- Ransomware canary (T1486): decoy "finance records" nobody legitimately touches ---
- name: Create the ransomware canary directory
  ansible.builtin.file:
    path: "{{ fileserver_canary_path }}"
    state: directory
    mode: "0770"

- name: Seed valuable-looking decoy files into the canary (create-only)
  ansible.builtin.copy:
    dest: "{{ fileserver_canary_path }}/{{ item }}"
    content: "DECOY — homelab ransomware canary. Not real data. Any change here is an incident.\n"
    mode: "0660"
    force: false
  loop: "{{ fileserver_canary_files }}"

# Endpoint detection for a dropped C2 implant / malware executing from a
# world-writable path (the gap the Phase 8 Sliver hunt exposed: an in-memory
# beacon run from /tmp was invisible to the host agent). A local logcollector
# command walks /proc/*/exe every 30s and reports any process whose backing
# binary lives in /tmp, /dev/shm, /var/tmp, or has been deleted-while-running
# (a classic evasion). Local ossec.conf command → runs without remote_commands.
# Paired with Wazuh rule 100200 (siem role local_rules.xml).
- name: Endpoint command monitor — process executing from a world-writable path
  ansible.builtin.blockinfile:
    path: /var/ossec/etc/ossec.conf
    marker: "<!-- {mark} ANSIBLE MANAGED: fs-01 suspicious-exec monitor -->"
    block: |
      <ossec_config>
        <localfile>
          <log_format>full_command</log_format>
          <alias>susp-exec-path</alias>
          <command>for e in /proc/[0-9]*/exe; do t=$(readlink "$e" 2>/dev/null); case "$t" in /tmp/*|/dev/shm/*|/var/tmp/*|*"(deleted)") d=${e%/exe}; echo "susp-exec path=$t pid=${d##*/}";; esac; done</command>
          <frequency>30</frequency>
        </localfile>
      </ossec_config>
  notify: Restart wazuh-agent

# --- YARA-on-FIM: scan files written to the share against malware signatures ---
# FIM says "a file changed on the share"; YARA says "and it matches known-malicious
# signatures". Rule 100450 (a share-scoped syscheck child) triggers the `yara`
# active-response, which runs yara.sh on the changed file; a match writes a
# `wazuh-yara:` line to active-responses.log → shipped to the manager → decoded →
# rule 100460 (malware alert). jq parses the AR JSON robustly.
- name: Install YARA + jq (for the FIM malware-scan active response)
  ansible.builtin.apt:
    name:
      - yara
      - jq
    state: present
    update_cache: true

- name: Create the YARA ruleset directory
  ansible.builtin.file:
    path: /var/ossec/ruleset/yara/rules
    state: directory
    mode: "0750"

- name: Deploy the YARA ruleset
  ansible.builtin.copy:
    src: malware.yar
    dest: /var/ossec/ruleset/yara/rules/malware.yar
    mode: "0640"
  notify: Restart wazuh-agent

- name: Deploy the YARA active-response script
  ansible.builtin.copy:
    src: yara.sh
    dest: /var/ossec/active-response/bin/yara
    owner: root
    group: wazuh
    mode: "0750"

- name: Ship the active-response log to the manager (carries YARA scan results)
  ansible.builtin.blockinfile:
    path: /var/ossec/etc/ossec.conf
    marker: "<!-- {mark} ANSIBLE MANAGED: fs-01 active-response log -->"
    block: |
      <ossec_config>
        <localfile>
          <log_format>syslog</log_format>
          <location>/var/ossec/logs/active-responses.log</location>
        </localfile>
      </ossec_config>
  notify: Restart wazuh-agent

- name: Enable and start the Wazuh agent
  ansible.builtin.systemd:
    name: wazuh-agent
    enabled: true
    state: started

# --- Verify -------------------------------------------------------------------
- name: Verify the [public] share is exported and the bait is present
  ansible.builtin.shell: |
    set -e
    testparm -s 2>/dev/null | grep -q '\[public\]'
    test -f {{ fileserver_share_path }}/map-backup-share.ps1
    grep -q 'svc-backup' {{ fileserver_share_path }}/map-backup-share.ps1
    echo VERIFIED
  register: fs_verify
  changed_when: false
  failed_when: "'VERIFIED' not in fs_verify.stdout"
