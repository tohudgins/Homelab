---
# fs-01 — Samba domain member with a deliberately weak share.
# The domain *join* (`net ads join -U administrator`) is a one-shot prerequisite
# needing domain-admin creds; this role assumes a joined member and manages its
# config + the weakness on top, idempotently.
fileserver_samba_services:
  - smbd
  - nmbd
  - winbind

fileserver_share_path: /srv/samba/public
# AD group (winbind-resolved) that owns the share; matches the live box.
fileserver_share_group: "domain users"

# Ransomware canary (T1486 Impact) — a decoy "finance records" directory under
# realtime FIM that legitimate users never touch. It's bait: a ransomware run that
# sweeps the file server encrypts these too, producing a burst of FIM change events
# that Wazuh rules 100430/100431 turn into an Impact alert. Filled with a few
# valuable-looking decoy files so there's something to encrypt.
fileserver_canary_path: /srv/finance-records
fileserver_canary_files:
  - Q3-Financials-2026.csv
  - Payroll-Master.csv
  - Acquisition-NDA.txt
  - Bank-Wire-Instructions.txt
  - Customer-PII-Export.csv
  - Board-Minutes-Confidential.txt

# Deliberate weakness (T1548.003 — Sudo and Sudo Caching): a local support/ops
# account with a NOPASSWD sudo grant on `find`, mirroring a real-world "let ops
# search logs/files without full root" grant — exploitable via the well-known
# GTFOBins `find ... -exec /bin/sh` escape. See phase-5-offense/
# attack-detect-writeups/05-linux-sudo-privesc-t1548.003.md.
fileserver_privesc_user: ops-logview
fileserver_privesc_user_comment: "Ops support — log/file search (no shell access needed)"

# Wazuh agent — same pinned version/repo as the other agents.
wazuh_agent_version: "4.14.7-1"
wazuh_apt_key_url: "https://packages.wazuh.com/key/GPG-KEY-WAZUH"
wazuh_apt_repo: "deb [signed-by=/usr/share/keyrings/wazuh.gpg] https://packages.wazuh.com/4.x/apt/ stable main"
