# Homelab inventory — segmented ARM64 lab (see docs/00-ip-plan.md)
#
# Connection model: the Ansible control node is the macOS host. It reaches
# rtr-01 directly on its vmnet8 (NAT) WAN IP, and every internal segment host
# via ProxyJump *through* rtr-01 — the same path a real jump-box topology uses.
# ProxyJump for the internal group is set in group_vars/internal.yml.
all:
  children:

    routers:
      hosts:
        rtr-01:
          ansible_host: 192.168.168.133   # vmnet8 NAT (WAN) — reachable from host
          ansible_user: root              # minimal Debian: no sudo, key-based root
      vars:
        segment: wan

    # Everything behind the router. ProxyJump + become live in internal.yml.
    internal:
      children:
        domain_controllers:
          hosts:
            dc-01:
              ansible_host: 10.10.10.10
        fileservers:
          hosts:
            fs-01:
              ansible_host: 10.10.10.20
        siem:
          hosts:
            siem-01:
              ansible_host: 10.10.30.10
        dmz:
          hosts:
            dmz-01:
              ansible_host: 10.10.20.10
        scanners:
          hosts:
            scan-01:
              ansible_host: 10.10.40.20   # REDTEAM — Greenbone/OpenVAS scanner
      vars:
        ansible_user: tohudgins

    # Windows victim — managed manually for now (WinRM automation is a later
    # increment; documented in phase-7-automation/README.md).
    windows:
      hosts:
        ws-01:
          ansible_host: 10.10.10.50
          ansible_user: localadmin
