---
# Deploy osquery (continuous fleet-state querying) to the Linux hosts, then feed its
# results log into Wazuh. Part of site.yml (it only touches dc-01/fs-01, already
# converged there); also runnable on its own: `make converge PLAY=osquery.yml`.
- name: Osquery — Linux fleet (dc-01, fs-01)
  hosts: domain_controllers:fileservers
  become: true
  roles:
    - osquery
