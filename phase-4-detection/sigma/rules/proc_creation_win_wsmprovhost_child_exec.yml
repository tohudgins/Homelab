title: Remote Command Execution via WinRM (wsmprovhost Child Process)
id: a17eeee6-30aa-4bca-9090-01a1b192fab2
status: experimental
description: |
    Detects any process spawned by wsmprovhost.exe — the WinRM/PowerShell-Remoting
    host process. It only runs to service an inbound remote session, so a child of
    it is remote command execution (evil-winrm, NetExec --exec-method winrm,
    Enter-PSSession), i.e. lateral movement onto this host.
references:
    - https://attack.mitre.org/techniques/T1021/006/
author: Tyler Hudgins (homelab)
date: 2026-09-06
tags:
    - attack.lateral_movement
    - attack.t1021.006
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        ParentImage|endswith: '\wsmprovhost.exe'
    condition: selection
falsepositives:
    - Legitimate remote administration over WinRM (not used in this lab)
level: high
